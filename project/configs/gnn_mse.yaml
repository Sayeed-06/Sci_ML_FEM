# Model 1: GNN + MSE Loss
run_name: gnn_mse

model:
  type: gnn
  node_in_dim: 11
  edge_in_dim: 3
  hidden_dim: 128
  edge_hidden: 64
  num_layers: 6
  out_dim: 3
  dropout: 0.0

loss:
  type: mse
  weights: [1.0, 1.0, 1.0]   # equal weighting on normalised outputs

training:
  epochs: 300
  lr: 1.0e-3
  lr_min: 1.0e-6
  weight_decay: 1.0e-4
  batch_size: 4              # small batches for large graphs (>500 nodes)
  patience: 40
  grad_clip: 1.0
  checkpoint_every: 50
  device: cpu                # change to cuda if GPU available
  seed: 42

data:
  root: generated_cases
  normalise_targets: true
  train_frac: 0.70
  val_frac: 0.15
  include_diagonals: true

output:
  run_dir: runs/gnn_mse
