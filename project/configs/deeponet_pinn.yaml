# DeepONet v4 + PINN Loss (same branch improvement as deeponet_mse.yaml)
run_name: deeponet_pinn

model:
  type: deeponet
  node_in_dim: 11
  edge_in_dim: 3
  hidden_dim: 128
  edge_hidden: 64
  num_layers: 4
  trunk_hidden: 256
  trunk_layers: 6
  trunk_cols: [0, 1, 5, 7]  # SPATIAL ONLY: x_norm, y_norm, q_local, bc_flag
  use_load_coords: true      # + dx, dy to load centroid → trunk_in = 6
  p: 128
  out_dim: 3
  n_freqs: 64
  fourier_scale: 1.0
  trunk_dropout: 0.2
  attn_dim: 128              # cross-attention key/query dim
  n_heads: 4                 # multi-head attention heads

loss:
  type: pinn
  lambda_data: 1.0
  lambda_pde: 1.0e-6
  lambda_stress: 1.0e-5
  lambda_bc: 0.05
  warmup_epochs: 25    # pure data loss for first 25 epochs (cross-attn stabilises faster)
  ramp_epochs: 40      # linear ramp 0→1 over next 40 epochs (physics fully on at ep 65)

training:
  epochs: 500
  lr: 2.0e-4
  lr_min: 1.0e-6
  weight_decay: 1.0e-3
  batch_size: 4
  patience: 90
  grad_clip: 1.0
  checkpoint_every: 50
  device: cpu          # change to cuda
  seed: 42

data:
  root: generated_cases
  normalise_targets: true
  train_frac: 0.70
  val_frac: 0.15
  include_diagonals: true

output:
  run_dir: runs/deeponet_pinn
